apiVersion: governance.toolkit/v1
version: "1.0"
name: audit-blob-telemetry-policy
default_action: deny
rules:
  - name: allow-weather
    condition: "tool_name == 'GetWeather'"
    action: allow
    priority: 10

  - name: allow-time
    condition: "tool_name == 'GetTime'"
    action: allow
    priority: 10

  - name: allow-location
    condition: "tool_name == 'GetLocation'"
    action: allow
    priority: 10

  - name: block-shell
    condition: "tool_name == 'execute_shell'"
    action: deny
    priority: 100
